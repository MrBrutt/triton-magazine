name: Проверки

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Страницы собраны (build_pages.py ничего не меняет)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python3 tools/build_pages.py
      - name: Сравнить с закоммиченным
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git --no-pager diff --stat
            echo "::error::После правки app.js, admin.js, app.css или data/issues.json запустите python3 tools/build_pages.py и закоммитьте результат."
            exit 1
          fi

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
